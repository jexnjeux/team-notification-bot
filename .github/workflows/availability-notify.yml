name: Availability Notification

# GitHub schedule 트리거가 동작하지 않아 외부 스케줄러(cron-job.org)가
# 매일 09:00 KST에 workflow_dispatch API를 호출해 실행한다. (README 참고)
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send availability notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node src/notify.js
