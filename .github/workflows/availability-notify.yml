name: Availability Notification

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Seoul"
    - cron: "*/10 * * * *" # 테스트용 (UTC), 확인 후 제거

  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send availability notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node src/notify.js